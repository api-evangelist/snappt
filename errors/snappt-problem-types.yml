problems:
- status: 400
  title: Bad Request
  detail: The request payload or query string parameter you passed was not valid
  schema: ErrorResponse
  occurrences: 30
  causes:
  - Invalid or missing request body fields.
  - Invalid query-string parameter values.
  - 'Property create/update with a `status` other than ACTIVE or DISABLED (enforced since v0.9.2).'
  - Document upload rejected by synchronous checks when `?checks=true` — see `failedChecks`.
  remediation: Correct the payload or query parameter and retry; inspect `failedChecks` for document upload failures.
- status: 401
  title: Unauthorized
  detail: The Authorization header or Snappt applicant session token you passed was not valid
  schema: ErrorResponse
  occurrences: 48
  causes:
  - Missing or malformed `Authorization: Bearer <partner API key>` header.
  - Revoked or wrong-environment partner API key (demo key against production, or vice versa).
  - Expired session token — session tokens expire after 24 hours or on application submission.
  - Missing or invalid `x-unauthenticated-session-token` header on a session-scoped call.
  remediation: >-
    Re-issue the partner API key from your Snappt account team, or create a fresh applicant session
    with POST /session to obtain a new session token.
  note: >-
    The API edge returns 401 for every unauthenticated request including `/` and unknown paths, so a
    401 does not distinguish "wrong credentials" from "no such route".
- status: 404
  title: Not Found
  detail: The item you requested could not be found
  schema: ErrorResponse
  occurrences: 31
  causes:
  - Unknown propertyId, applicantId, idVerificationId, document id, or webhook id.
  - A resource that belongs to a company the API key is not scoped to.
  remediation: Verify the id, and confirm the API key is scoped to the company/property that owns it.
