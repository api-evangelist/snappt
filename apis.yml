apis:
- name: Snappt Enterprise API
  description: >-
    Partner REST API for the Snappt fraud-detection, income-verification and identity-verification platform. Covers
    account lookup, property creation and feature configuration, applicant sessions (create session, update
    application, upload PDF documents, submit), applicant lookup and PDF report retrieval, ID-verification session
    creation and reports, and webhook registration with signing secrets. Authenticated with a Snappt partner API key
    passed as an HTTP bearer token; applicant-session calls use a short-lived session token in the
    x-unauthenticated-session-token header.
  humanURL: https://snappt-enterprise-api.readme.io/
  baseURL: https://enterprise-api.snappt.com
