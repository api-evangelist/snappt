aid: snappt
name: Snappt
description: >-
  Snappt is a Los Angeles-based applicant-screening and document-fraud-detection company serving the multifamily
  rental and property-management industry. Its Applicant Trust Platform combines proprietary AI document forensics
  with human review to detect edited pay stubs and bank statements, verify applicant income from traditional and
  connected payroll sources, verify identity with biometric and document checks, and confirm rental payment history.
  Snappt exposes this to property-management systems and partners through the Snappt Enterprise API — a partner
  API-key-authenticated REST API covering properties, applicant sessions, document upload, fraud and income reports,
  ID-verification sessions and outbound webhooks — plus an embeddable browser SDK that launches the applicant
  verification flow as a modal inside a partner's own leasing flow.
