  npm registry search, PyPI, RubyGems, NuGet, Packagist, pkg.go.dev, crates.io, and the Snappt
  Enterprise API docs (Embedded SDK Integration Guide)
note: >-
  Snappt publishes no client library to any public package registry. The only first-party client
  artifact is the Snappt Embedded SDK, a browser script served directly from the API host and
  gated on a Client ID plus a domain allowlist — there is no npm/CDN package for it. The single
  registry hit is a third-party Laravel/PHP wrapper maintained by TenantCloud, not by Snappt.
packages:
- language: javascript
  registry: none
  distribution: hosted-script
  name: Snappt Embedded SDK
  url: https://snappt-enterprise-api.readme.io/docs/embedded-sdk-integration-guide
  install: '<script src="https://enterprise-api.snappt.com/embedded/v1.0.0.js?iframe=true&clientId=YOUR_CLIENT_ID"></script>'
  version: v1.0.0
  official: true
  global: Snappt
  note: >-
    Loads the global `Snappt` object exposing `Snappt.portal.show({companyShortId, propertyShortId, ...})`.
    Requires a Client ID issued by the Snappt account team; the script will not load unless the page
    origin matches the Client ID's configured domain allowlist (exact origins or *.wildcard subdomains).
