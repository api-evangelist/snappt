    get:
      tags:
      - Applicants
      summary: List applicants
      parameters:
      - schema:
          type: number
          description: The total number of rows to respond with. Defaults to 50.
        required: false
        name: rowsPerPage
        in: query
      - schema:
          type: number
          description: The current page. Defaults to 0.
        required: false
        name: page
        in: query
      - schema:
          type: string
          description: 'Sort by any of the allowed options: result, status, insertedAt, firstName, lastName, email, externalId.'
        required: false
        name: sort
        in: query
      - schema:
          type: string
          description: 'Filter results by any of these fields: result, status, insertedAt, firstName, lastName, email, externalId.
            You can filter using the following operators: =,<=,>=,!=,<,>,!@>,@>. The last option (@>) is the equivalent to
            the in operator (!@> is equivalent to not in) and should receive a list of values separated by a "|". You can
            also filter by null values passing the key word IS_NULL, ex: email=IS_NULL or email!=IS_NULL to look for the not
            nulls ones.'
          example: '`firstName=example,status=READY` OR `status@>READY|PENDING` OR `externalId=PROSPECT-123`'
        required: false
        name: filter
        in: query
