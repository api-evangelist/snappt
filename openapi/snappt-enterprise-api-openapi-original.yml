                    format: uri
                  callbackUrl:
                    type: string
                    format: uri
                  externalId:
                    type: string
                  externalMetadata:
                    type: object
                    additionalProperties:
                      nullable: true
                    description: Arbitrary metadata from your external system. Keys/values are stored but not interpreted
                      by Snappt.
                  linkOptions:
                    type: object
                    properties:
                      expiresOnSubmit:
                        type: boolean
