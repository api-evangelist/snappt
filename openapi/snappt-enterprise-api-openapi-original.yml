  /id-verification/applicants:
    get:
      tags:
      - ID Verification
      summary: Retrieve all ID verification records
      parameters:
      - schema:
          type: number
          description: The total number of rows to respond with. Defaults to 50.
        required: false
        name: rowsPerPage
        in: query
      - schema:
          type: number
          description: The current page. Defaults to 0.
        required: false
        name: page
        in: query
      - schema:
          type: string
          description: 'Sort by any of the allowed options: status, insertedAt, sessionClosedAt, name, propertyName, firstName,
            lastName, email.'
        required: false
        name: sort
        in: query
      - schema:
          type: string
          description: 'Filter results by any of these fields: status, insertedAt, sessionClosedAt, firstName, lastName, name,
            email, propertyName.NOTE: Only the "=" operator is supported for score.You can filter using the following operators:
            =,<=,>=,!=,<,>,!@>,@>. The last option (@>) is the equivalent to the in operator (!@> is equivalent to not in)
            and should receive a list of values separated by a "|". You can also filter by null values passing the key word
            IS_NULL, ex: email=IS_NULL or email!=IS_NULL to look for the not nulls ones.'
          example: '`email=test@snappt.com,insertedAt>2021-01-01T00:00:00.000Z`'
        required: false
        name: filter
        in: query
      - schema:
          type: string
          description: Filter identity applicants by name or email address.
        required: false
        name: q
        in: query
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sessionCreatedAt:
                      type: string
                      description: An ISO-formattted datetime
                    sessionUpdatedAt:
                      type: string
                      description: An ISO-formattted datetime
                    sessionClosedAt:
                      type: string
                      description: An ISO-formattted datetime
                    licenseExpiresAt:
                      type: string
                      description: An ISO-formattted datetime
                    email:
                      type: string
                    phone:
                      type: string
                      nullable: true
                    firstName:
                      type: string
                    lastName:
                      type: string
                    name:
                      type: string
                      nullable: true
                    id:
                      type: string
                      format: uuid
                    status:
                      type: string
                      nullable: true
                      enum:
                      - PASS
                      - FAIL
                      - PENDING
                      - NEEDS REVIEW
                      - REVIEWING
                      - CANCELED
                      - INCOMPLETE
                    provider:
                      type: string
                      enum:
                      - clear
                      - incode
                    flowType:
                      type: string
                      nullable: true
                      enum:
                      - enhanced
                      - basic
                    property:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                      required:
                      - id
                      - name
                  required:
                  - sessionCreatedAt
                  - sessionUpdatedAt
                  - sessionClosedAt
                  - licenseExpiresAt
                  - email
                  - phone
                  - firstName
                  - lastName
                  - name
                  - id
                  - status
                  - provider
                  - flowType
                  - property
        '400':
          description: The request payload or query string parameter you passed was not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: The Authorization header or Snappt applicant session token you passed was not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
