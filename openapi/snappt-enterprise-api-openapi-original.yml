      tags:
      - ID Verification
      summary: Send an applicant a link to the identity upload portal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyShortId:
                  type: string
                  example: huTnN82gGH
                propertyShortId:
                  type: string
                  example: WyiKu7d4Zm
                firstName:
                  type: string
                  description: Optional, will be auto-filled from the applicant's provided ID if left blank.
                  example: Bob
                lastName:
                  type: string
                  description: Optional, will be auto-filled from the applicant's provided ID if left blank.
                  example: Smith
                email:
                  type: string
                  format: email
                  description: Optional
                  example: bob@gmail.com
                metadata:
                  type: object
                  description: Optional
                  example:
                    yourApplicantId: 4313e1fd-b380-412e-9e0e-26755c698239
                redirectUrl:
                  type: string
                  format: uri
                  description: Optional, Snappt will redirect to this url at the end of the flow.
                flowType:
                  type: string
                  enum:
                  - enhanced
                  - basic
              required:
              - email
              additionalProperties: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  idVerificationId:
                    type: string
                    format: uuid
                  metadata:
                    type: object
                additionalProperties: false
        '400':
          description: The request payload or query string parameter you passed was not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: The Authorization header or Snappt applicant session token you passed was not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
