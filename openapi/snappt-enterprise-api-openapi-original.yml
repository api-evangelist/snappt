    post:
      tags:
      - Applicant Sessions
      summary: Create an applicant session
      description: Make a request to this API to begin a new applicant session and obtain a session token you can use to update
        applicant info, upload documents, and submit the application for processing.
      parameters:
      - schema:
          type: string
          enum:
          - leasing_team
          - unauthenticated_user
          default: unauthenticated_user
        required: false
        name: applicationType
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyShortId:
                  type: string
                propertyShortId:
                  type: string
                firstName:
                  type: string
                  description: Optional, can be provided later via PUT /session/application.
                  example: Bob
                lastName:
                  type: string
                  description: Optional, can be provided later via PUT /session/application.
                  example: Smith
                email:
                  type: string
                  format: email
                  description: Optional, can be provided later via PUT /session/application.
                  example: bob@gmail.com
                applicantIdentifier:
                  type: string
                  format: uuid
                  description: The applicant identifier that links this application to a previous application if it exists.
                  example: 00000000-0000-0000-0000-000000000000
                identityId:
                  type: string
                  nullable: true
                  format: uuid
                  description: The id that relates to the universal user concept across all applications.
                  example: 00000000-0000-0000-0000-000000000000
              additionalProperties: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    format: uuid
                  id:
                    type: string
                    format: uuid
                  applicantDetailId:
                    type: string
                    format: uuid
                  identityId:
                    type: string
                    nullable: true
                    format: uuid
                required:
                - token
                - id
                - applicantDetailId
                - identityId
        '400':
          description: The request payload or query string parameter you passed was not valid
