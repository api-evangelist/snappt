      - Applicants
      summary: Update an applicant's information
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: applicantId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type:
                  - string
                  - 'null'
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 25
                  pattern: ^[A-Za-z]+$
                middleInitial:
                  type: string
                  minLength: 1
                  maxLength: 1
                  pattern: ^[A-Z]$
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  pattern: ^[A-Za-z]+$
                email:
                  type: string
                  minLength: 1
                  format: email
                phone:
                  type: string
                  minLength: 10
                  maxLength: 15
                  pattern: ^[0-9]+$
                notification:
                  type: boolean
                updatedAt:
                  type: string
                  description: An ISO-formattted datetime
              required:
