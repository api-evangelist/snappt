disjoint_graphs:
- graph: fraud-detection
  root: ApplicantDetail -> Applicant -> Proof
- graph: identity-verification
  root: IdVerification
  note: >-
    Snappt states explicitly that Identity Verification applicants and Fraud Detection applicants do
    not share ids and are not linked. Partners correlate the two through their own externalId /
    metadata, not through Snappt.
id_conventions:
